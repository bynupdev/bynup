<!-- payments/templates/payments/admin_quick_activate.html -->
{% extends 'admin/base_site.html' %}

{% block content %}
<div class="module">
    <h2>Quick Activate Subscription</h2>
    
    <div style="max-width: 500px; margin: 0 auto; padding: 40px;">
        <div style="background: #f8f9fa; padding: 30px; border-radius: 12px;">
            <h3 style="margin-top: 0; text-align: center;">Search User by Email</h3>
            
            <form method="post">
                {% csrf_token %}
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold;">
                        User Email:
                    </label>
                    <input type="email" 
                           name="email" 
                           placeholder="user@example.com"
                           required
                           style="width: 100%; padding: 12px; border: 2px solid #e1e5eb; border-radius: 8px; font-size: 16px;">
                </div>
                
                <button type="submit" 
                        style="width: 100%; padding: 14px; background: #4361ee; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;">
                    Find & Activate
                </button>
            </form>
            
            <div style="margin-top: 20px; text-align: center;">
                <a href="{% url 'payments:admin_pending_payments' %}" style="color: #6c757d; text-decoration: none;">
                    ← Back to Pending List
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
