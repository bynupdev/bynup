<!-- payments/templates/payments/includes/credentials_section.html -->
{% if mode == 'test' %}
<div class="test-credentials {% if not gateway.is_test_mode %}d-none{% endif %}">
    <h6 class="border-bottom pb-2 mb-3">
        <i class="fas fa-vial me-2"></i>Test Credentials
    </h6>
    
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="test_public_key" class="form-label">Test Public Key</label>
            <input type="text" class="form-control api-key-field" id="test_public_key"
                   name="test_public_key" value="{{ gateway.test_public_key|default:'' }}"
                   placeholder="pk_test_...">
        </div>
        <div class="col-md-6">
            <label for="test_secret_key" class="form-label">Test Secret Key</label>
            <input type="password" class="form-control api-key-field" id="test_secret_key"
                   name="test_secret_key" value="{{ gateway.test_secret_key|default:'' }}"
                   placeholder="sk_test_...">
        </div>
    </div>
</div>
{% else %}
<div class="live-credentials {% if gateway.is_test_mode %}d-none{% endif %}">
    <h6 class="border-bottom pb-2 mb-3">
        <i class="fas fa-globe me-2"></i>Live Credentials
    </h6>
    
    <div class="alert alert-warning">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <strong>Warning:</strong> Live credentials will process real payments. Test thoroughly first.
    </div>
    
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="live_public_key" class="form-label">Live Public Key</label>
            <input type="text" class="form-control api-key-field" id="live_public_key"
                   name="live_public_key" value="{{ gateway.live_public_key|default:'' }}"
                   placeholder="pk_live_...">
        </div>
        <div class="col-md-6">
            <label for="live_secret_key" class="form-label">Live Secret Key</label>
            <input type="password" class="form-control api-key-field" id="live_secret_key"
                   name="live_secret_key" value="{{ gateway.live_secret_key|default:'' }}"
                   placeholder="sk_live_...">
        </div>
    </div>
</div>
{% endif %}
