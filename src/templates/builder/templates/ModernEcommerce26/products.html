<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LUMIÈRE | Shop Fine Jewelry</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ========== COLOR SYSTEM ========== */
    :root {
      --background: #F2F7F6;
      --heading: #F2E7E6;
      --text: #F388A2;
      --primary: #7F805C;
      --accent: #F2DDB3;
      --border-radius: 24px;
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--background);
      font-family: 'Inter', sans-serif;
      color: #1e2a2a;
      line-height: 1.4;
    }

    h1, h2, h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* ========== PAGE HEADER ========== */
    .shop-header {
      padding: 8rem 0 3rem;
      text-align: center;
    }

    .shop-header h1.editable-text.editable-section.no-drop-zone[data-section="50"] {
      font-size: 3.5rem;
      color: #2c3a2f;
      margin-bottom: 1rem;
    }

    .shop-header p.editable-text.editable-section.no-drop-zone[data-section="51"] {
      font-size: 1rem;
      color: #5b6e55;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ========== SHOP CONTROLS ========== */
    .shop-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(127, 128, 92, 0.2);
    }

    .search-wrapper {
      flex: 1;
      max-width: 400px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.8rem;
      border: 1px solid rgba(127, 128, 92, 0.3);
      border-radius: 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      background: white;
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--text);
      box-shadow: 0 0 0 3px rgba(243, 136, 162, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-size: 1rem;
    }

    .filter-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .categories-btn.editable-text.editable-section.no-drop-zone[data-section="52"] {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.8rem;
      background: transparent;
      border: 1px solid var(--text);
      border-radius: 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
    }

    .categories-btn:hover {
      background: var(--text);
      color: white;
    }

    .sort-select {
      padding: 0.8rem 1.5rem;
      border: 1px solid rgba(127, 128, 92, 0.3);
      border-radius: 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      background: white;
      cursor: pointer;
    }

    /* ========== PRODUCT GRID ========== */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem;
      margin-bottom: 4rem;
    }

    .product-card {
      background: white;
      border-radius: var(--border-radius);
      overflow: hidden;
      transition: var(--transition);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02);
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.1);
      background: #fffef7;
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-img {
      transform: scale(1.02);
    }

    .product-info {
      padding: 1.2rem 1rem 1rem;
      text-align: center;
    }

    .product-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 500;
      color: #3a4a3c;
      margin-bottom: 0.3rem;
    }

    .product-price {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .product-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      padding: 0 1rem 1.2rem;
    }

    .add-to-cart-btn {
      flex: 1;
      background: var(--text);
      border: none;
      padding: 0.6rem 0.8rem;
      border-radius: 40px;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .add-to-cart-btn:hover {
      background: #e27a97;
      transform: translateY(-2px);
    }

    .wishlist-btn {
      background: transparent;
      border: 1px solid rgba(127, 128, 92, 0.3);
      border-radius: 40px;
      padding: 0.6rem 1rem;
      cursor: pointer;
      transition: var(--transition);
      color: var(--primary);
    }

    .wishlist-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      text-align: center;
      padding: 4rem;
      background: white;
      border-radius: var(--border-radius);
      grid-column: 1 / -1;
    }

    .empty-state h3 {
      font-size: 1.8rem;
      color: #2c3a2f;
      margin-bottom: 1rem;
    }

    .empty-state p {
      color: #5b6e55;
      margin-bottom: 1.5rem;
    }

    .empty-state a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1200px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
      }
    }

    @media (max-width: 992px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .shop-header h1 {
        font-size: 2.8rem;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 0 1.5rem;
      }
      .shop-header {
        padding: 6rem 0 2rem;
      }
      .shop-header h1 {
        font-size: 2.2rem;
      }
      .shop-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .search-wrapper {
        max-width: 100%;
      }
      .filter-actions {
        justify-content: space-between;
      }
      .products-grid {
        grid-template-columns: 1fr;
        max-width: 380px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>
<body>

<!-- Shop Header -->
<div class="shop-header">
  <div class="container">
    <h1 class="editable-text editable-section no-drop-zone" data-section="50" data-text="40">Our Collection</h1>
    <p class="editable-text editable-section no-drop-zone" data-section="51" data-text="41">Discover timeless jewelry crafted with precision and passion. Each piece tells a story of elegance.</p>
  </div>
</div>

<!-- Shop Controls -->
<div class="container">
  <div class="shop-controls">
    <div class="search-wrapper">
      <i class="fas fa-search search-icon editable-icon" data-icon="20" data-default-class="fas fa-search"></i>
      <input type="text" class="search-input" id="searchInput" placeholder="Search jewelry...">
    </div>
    <div class="filter-actions">
      <a href="?page=categories" class="categories-btn editable-text editable-section no-drop-zone" data-section="52" data-text="42">
        <i class="fas fa-gem editable-icon" data-icon="21" data-default-class="fas fa-gem"></i> Browse Categories
      </a>
      <select class="sort-select" id="sortSelect">
        <option value="newest">Newest First</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
      </select>
    </div>
  </div>
</div>

<!-- Products Grid -->
<div class="container">
  <div class="products-grid" id="productsGrid">
    <!-- Product 1 - Editable -->
    <div class="product-card editable-section no-drop-zone" data-section="53" data-product-id="1" data-product-name="Gold Pendant Necklace" data-product-price="1280">
      <img class="product-img editable-image" data-image="10" src="https://images.pexels.com/photos/2079656/pexels-photo-2079656.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Gold Pendant Necklace">
      <div class="product-info">
        <div class="product-name editable-section editable-text no-drop-zone" data-section="54" data-text="43">Gold Pendant Necklace</div>
        <div class="product-price editable-section editable-text no-drop-zone" data-section="55" data-text="44">$1,280</div>
      </div>
      <div class="product-actions">
        <button class="add-to-cart-btn" data-product-id="1"><i class="fas fa-shopping-bag"></i> Add to Cart</button>
        <button class="wishlist-btn" data-product-id="1"><i class="far fa-heart"></i></button>
      </div>
    </div>

    <!-- Product 2 - Static Sample -->
    <div class="product-card" data-product-id="2" data-product-name="Diamond Solitaire Ring" data-product-price="3950">
      <img class="product-img" src="https://images.pexels.com/photos/948211/pexels-photo-948211.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Diamond Ring">
      <div class="product-info">
        <div class="product-name">Diamond Solitaire Ring</div>
        <div class="product-price">$3,950</div>
      </div>
      <div class="product-actions">
        <button class="add-to-cart-btn" data-product-id="2"><i class="fas fa-shopping-bag"></i> Add to Cart</button>
        <button class="wishlist-btn" data-product-id="2"><i class="far fa-heart"></i></button>
      </div>
    </div>

    <!-- Product 3 - Static Sample -->
    <div class="product-card" data-product-id="3" data-product-name="Minimalist Chain Bracelet" data-product-price="890">
      <img class="product-img" src="https://images.pexels.com/photos/1192798/pexels-photo-1192798.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Minimalist Bracelet">
      <div class="product-info">
        <div class="product-name">Minimalist Chain Bracelet</div>
        <div class="product-price">$890</div>
      </div>
      <div class="product-actions">
        <button class="add-to-cart-btn" data-product-id="3"><i class="fas fa-shopping-bag"></i> Add to Cart</button>
        <button class="wishlist-btn" data-product-id="3"><i class="far fa-heart"></i></button>
      </div>
    </div>

    <!-- Product 4 - Static Sample -->
    <div class="product-card" data-product-id="4" data-product-name="Cultured Pearl Earrings" data-product-price="1450">
      <img class="product-img" src="https://images.pexels.com/photos/2011703/pexels-photo-2011703.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Pearl Earrings">
      <div class="product-info">
        <div class="product-name">Cultured Pearl Earrings</div>
        <div class="product-price">$1,450</div>
      </div>
      <div class="product-actions">
        <button class="add-to-cart-btn" data-product-id="4"><i class="fas fa-shopping-bag"></i> Add to Cart</button>
        <button class="wishlist-btn" data-product-id="4"><i class="far fa-heart"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // Search functionality
    const searchInput = document.getElementById('searchInput');
    const products = document.querySelectorAll('.product-card');
    
    function filterProducts() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      products.forEach(product => {
        const productName = product.querySelector('.product-name').textContent.toLowerCase();
        if (searchTerm === '' || productName.includes(searchTerm)) {
          product.style.display = 'block';
        } else {
          product.style.display = 'none';
        }
      });
    }
    
    if (searchInput) {
      searchInput.addEventListener('input', filterProducts);
    }
    
    // Sort functionality
    const sortSelect = document.getElementById('sortSelect');
    const productsGrid = document.getElementById('productsGrid');
    
    function sortProducts() {
      const sortValue = sortSelect.value;
      const productsArray = Array.from(products);
      
      productsArray.sort((a, b) => {
        const priceA = parseFloat(a.getAttribute('data-product-price') || a.querySelector('.product-price').textContent.replace('$', '').replace(',', ''));
        const priceB = parseFloat(b.getAttribute('data-product-price') || b.querySelector('.product-price').textContent.replace('$', '').replace(',', ''));
        const nameA = a.querySelector('.product-name').textContent;
        const nameB = b.querySelector('.product-name').textContent;
        
        if (sortValue === 'price-low') {
          return priceA - priceB;
        } else if (sortValue === 'price-high') {
          return priceB - priceA;
        } else {
          return 0;
        }
      });
      
      productsArray.forEach(product => {
        productsGrid.appendChild(product);
      });
    }
    
    if (sortSelect) {
      sortSelect.addEventListener('change', sortProducts);
    }
    
    // Add to Cart buttons
    const addToCartBtns = document.querySelectorAll('.add-to-cart-btn');
    addToCartBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const productId = btn.getAttribute('data-product-id');
        const productCard = btn.closest('.product-card');
        const productName = productCard.querySelector('.product-name').textContent;
        
        btn.innerHTML = '<i class="fas fa-check"></i> Added';
        btn.style.background = '#7F805C';
        
        setTimeout(() => {
          btn.innerHTML = '<i class="fas fa-shopping-bag"></i> Add to Cart';
          btn.style.background = 'var(--text)';
        }, 1500);
        
        console.log(`Added product ${productId} to cart: ${productName}`);
        if (window.cartManager) {
          window.cartManager.addToCart(productId, 1);
        }
      });
    });
    
    // Wishlist buttons
    const wishlistBtns = document.querySelectorAll('.wishlist-btn');
    wishlistBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const productId = btn.getAttribute('data-product-id');
        const productCard = btn.closest('.product-card');
        const productName = productCard.querySelector('.product-name').textContent;
        
        const icon = btn.querySelector('i');
        if (icon.classList.contains('far')) {
          icon.classList.remove('far');
          icon.classList.add('fas');
          btn.style.borderColor = 'var(--text)';
          btn.style.color = 'var(--text)';
        } else {
          icon.classList.remove('fas');
          icon.classList.add('far');
          btn.style.borderColor = 'rgba(127, 128, 92, 0.3)';
          btn.style.color = 'var(--primary)';
        }
        
        console.log(`Toggled wishlist for product ${productId}: ${productName}`);
        if (window.cartManager) {
          window.cartManager.addToWishlist(productId);
        }
      });
    });
    
    // Product card click to view details
    const productCards = document.querySelectorAll('.product-card');
    productCards.forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
          return;
        }
        const productId = card.getAttribute('data-product-id');
        window.location.href = `?page=product-details&id=${productId}`;
      });
    });
  })();
</script>
</body>
</html>
