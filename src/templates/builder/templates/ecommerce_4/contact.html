<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - {{ page.brand_name }}</title>
    <style>
        .page-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .nav { background: #333; padding: 1rem; margin-bottom: 2rem; }
        .nav a { color: white; margin-right: 1rem; text-decoration: none; }
        .contact-form { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="page-container">
        <nav class="nav">
            <a href="?page=home">Home</a>
            <a href="?page=products">Products</a>
            <a href="?page=about">About</a>
            <a href="?page=contact">Contact</a>
            <a href="?page=cart">Cart</a>
        </nav>

        <header class="editable-section" data-section="13">
            <h1 class="editable-text" data-text="26">Contact Us</h1>
            <p class="editable-text" data-text="27">Get in touch with our team</p>
        </header>

        <section class="editable-section" data-section="14">
            <div style="display: flex; gap: 3rem;">
                <div style="flex: 1;">
                    <h3 class="editable-text" data-text="28">Contact Information</h3>
                    <p class="editable-text" data-text="29">Email: support@{{ page.subdomain }}.com</p>
                    <p class="editable-text" data-text="30">Phone: (555) 123-4567</p>
                    <p class="editable-text" data-text="31">Address: 123 Business St, City, State 12345</p>
                </div>
                
                <div style="flex: 1;">
                    <form class="contact-form">
                        <div class="form-group">
                            <label class="editable-text" data-text="32">Name</label>
                            <input type="text" placeholder="Your name">
                        </div>
                        <div class="form-group">
                            <label class="editable-text" data-text="33">Email</label>
                            <input type="email" placeholder="Your email">
                        </div>
                        <div class="form-group">
                            <label class="editable-text" data-text="34">Message</label>
                            <textarea rows="5" placeholder="Your message"></textarea>
                        </div>
                        <button type="submit" class="editable-section editable-text" data-section="15" data-text="44"  style="background: #4361ee; color: white; border: none; padding: 12px 30px; border-radius: 5px;">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
