<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - {{ page.brand_name }}</title>
    <style>
        .page-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .nav { background: #333; padding: 1rem; margin-bottom: 2rem; }
        .nav a { color: white; margin-right: 1rem; text-decoration: none; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; }
        .product-card { border: 1px solid #ddd; padding: 1.5rem; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="page-container">
        <nav class="nav">
            <a href="?page=home">Home</a>
            <a href="?page=products">Products</a>
            <a href="?page=about">About</a>
            <a href="?page=contact">Contact</a>
            <a href="?page=cart">Cart</a>
        </nav>

        <header class="editable-section" id="header-section-5" data-section="4">
            <h1 class="editable-text" data-text="9">Our Products</h1>
            <p class="editable-text" data-text="10">Discover our amazing collection</p>
        </header>


        <section class="editable-section" id="product-section" data-section="5">
            <div class="product-grid">
                <div class="product-card editable-section" data-section="6">
                    <h3 class="editable-text" data-text="11">Premium Headphones</h3>
                    <p class="editable-text" data-text="12">High-quality sound experience</p>
                    <div class="editable-text" data-text="13" style="font-size: 1.5rem; font-weight: bold; color: #f72585; margin: 1rem 0;">$99.99</div>
                    <button class="editable-section" data-section="7" style="background: #4361ee; color: white; border: none; padding: 10px 20px; border-radius: 5px; width: 100%;">
                        Add to Cart
                    </button>
                </div>

                <div class="product-card" >
                    <h3>Wireless Mouse</h3>
                    <p>Ergonomic and responsive</p>
                    <div style="font-size: 1.5rem; font-weight: bold; color: #f72585; margin: 1rem 0;">$29.99</div>
                    <button style="background: #4361ee; color: white; border: none; padding: 10px 20px; border-radius: 5px; width: 100%;">
                        Add to Cart
                    </button>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
