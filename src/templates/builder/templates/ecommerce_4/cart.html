<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - {{ page.brand_name }}</title>
    <style>
        .page-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .nav { background: #333; padding: 1rem; margin-bottom: 2rem; }
        .nav a { color: white; margin-right: 1rem; text-decoration: none; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #ddd; }
        .cart-summary { background: #f8f9fa; padding: 2rem; border-radius: 8px; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="page-container">
        <nav class="nav">
            <a href="?page=home">Home</a>
            <a href="?page=products">Products</a>
            <a href="?page=about">About</a>
            <a href="?page=contact">Contact</a>
            <a href="?page=cart">Cart</a>
        </nav>

        <header class="editable-section" data-section="16">
            <h1 class="editable-text" data-text="35">Your Shopping Cart</h1>
        </header>
        

        <section class="editable-section" data-section="18">
            <div class="cart-item">
                <div>
                    <h4 class="editable-text" data-text="36">Premium Headphones</h4>
                    <p class="editable-text" data-text="37">$99.99</p>
                </div>
                <div>
                    <button class="editable-section" data-section="19" style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px;">
                        Remove
                    </button>
                </div>
            </div>

            <div class="cart-item">
                <div>
                    <h4 class="editable-text" data-text="38">Wireless Mouse</h4>
                    <p class="editable-text" data-text="39">$29.99</p>
                </div>
                <div>
                    <button class="editable-section" data-section="20" style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px;">
                        Remove
                    </button>
                </div>
            </div>
        </section>

        <section class="editable-section" data-section="21">
            <div class="cart-summary">
                <h3 class="editable-text" data-text="40">Order Summary</h3>
                <p class="editable-text" data-text="41">Subtotal: $129.98</p>
                <p class="editable-text" data-text="42">Shipping: $9.99</p>
                <p class="editable-text" data-text="43">Total: $139.97</p>
                <button class="editable-section" data-section="22" style="background: #28a745; color: white; border: none; padding: 12px 30px; border-radius: 5px; width: 100%; margin-top: 1rem;">
                    Proceed to Checkout
                </button>
            </div>
        </section>
    </div>
</body>
</html>
