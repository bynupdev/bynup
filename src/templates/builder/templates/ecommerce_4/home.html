<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - {{ page.brand_name }}</title>
    <style>
        .page-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .nav { background: #333; padding: 1rem; margin-bottom: 2rem; }
        .nav a { color: white; margin-right: 1rem; text-decoration: none; }
        .hero { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 4rem 2rem; text-align: center; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="page-container">
        <nav class="nav">
            <a href="?page=home">Home</a>
            <a href="?page=products">Products</a>
            <a href="?page=about">About</a>
            <a href="?page=contact">Contact</a>
            <a href="?page=cart">Cart</a>
        </nav>

        <header class="editable-section" data-section="1">
            <div class="hero">
                <h1 class="editable-text" data-text="1">Welcome to {{ page.brand_name }}</h1>
                <p class="editable-text" data-text="2">Your one-stop shop for amazing products</p>
                <button class="editable-section" data-section="2" style="background: #f72585; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 1.1rem;">
                    Shop Now
                </button>
            </div>
        </header>

        <section class="editable-section" data-section="3" style="padding: 3rem 0;">
            <h2 class="editable-text" data-text="3">Why Choose Us</h2>
            <div style="display: flex; gap: 2rem; margin-top: 2rem;">
                <div style="flex: 1; padding: 2rem; background: #f8f9fa; border-radius: 8px;">
                    <h3 class="editable-text" data-text="4">Fast Delivery</h3>
                    <p class="editable-text" data-text="5">Get your products delivered in 24 hours</p>
                </div>
                <div style="flex: 1; padding: 2rem; background: #f8f9fa; border-radius: 8px;">
                    <h3 class="editable-text" data-text="7">Quality Guarantee</h3>
                    <p class="editable-text" data-text="8">30-day money back guarantee</p>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
