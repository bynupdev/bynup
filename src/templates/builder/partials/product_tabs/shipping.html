<form id="shippingForm">
    {% csrf_token %}
    <input type="hidden" name="product_id" value="{{ product.id }}">
    
    <div class="simple-form-group">
        <label class="simple-form-label">Shipping</label>
        <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" name="requires_shipping" {% if product.requires_shipping %}checked{% endif %}>
            <label class="form-check-label">This product requires shipping</label>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="simple-form-group">
                <label class="simple-form-label">Weight</label>
                <input type="number" class="simple-form-control" name="weight" value="{{ product.weight }}" step="0.01" min="0">
            </div>
        </div>
        <div class="col-md-4">
            <div class="simple-form-group">
                <label class="simple-form-label">Weight Unit</label>
                <select class="simple-form-control" name="weight_unit">
                    <option value="kg" {% if product.weight_unit == 'kg' %}selected{% endif %}>kg</option>
                    <option value="lb" {% if product.weight_unit == 'lb' %}selected{% endif %}>lb</option>
                    <option value="oz" {% if product.weight_unit == 'oz' %}selected{% endif %}>oz</option>
                </select>
            </div>
        </div>
        <div class="col-md-4">
            <div class="simple-form-group">
                <label class="simple-form-label">Free Shipping</label>
                <div class="form-check form-switch mt-2">
                    <input class="form-check-input" type="checkbox" name="free_shipping" {% if product.free_shipping %}checked{% endif %}>
                    <label class="form-check-label">Offer free shipping</label>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-4">
            <div class="simple-form-group">
                <label class="simple-form-label">Length (cm)</label>
                <input type="number" class="simple-form-control" name="length" value="{{ product.length }}" step="0.01" min="0">
            </div>
        </div>
        <div class="col-md-4">
            <div class="simple-form-group">
                <label class="simple-form-label">Width (cm)</label>
                <input type="number" class="simple-form-control" name="width" value="{{ product.width }}" step="0.01" min="0">
            </div>
        </div>
        <div class="col-md-4">
            <div class="simple-form-group">
                <label class="simple-form-label">Height (cm)</label>
                <input type="number" class="simple-form-control" name="height" value="{{ product.height }}" step="0.01" min="0">
            </div>
        </div>
    </div>
</form>
