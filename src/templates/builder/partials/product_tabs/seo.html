<form id="seoForm">
    {% csrf_token %}
    <input type="hidden" name="product_id" value="{{ product.id }}">
    
    <div class="simple-form-group">
        <label class="simple-form-label">Page Title</label>
        <input type="text" class="simple-form-control" name="meta_title" value="{{ product.meta_title }}" 
               placeholder="Usually same as product title">
        <small class="text-muted">Appears in search results and browser tab</small>
    </div>

    <div class="simple-form-group">
        <label class="simple-form-label">Meta Description</label>
        <textarea class="simple-form-control" name="meta_description" rows="3">{{ product.meta_description }}</textarea>
        <small class="text-muted">Brief description for search engines (150-160 characters)</small>
    </div>

    <div class="simple-form-group">
        <label class="simple-form-label">URL Handle</label>
        <input type="text" class="simple-form-control" name="slug" value="{{ product.slug }}" 
               placeholder="auto-generated-from-title">
        <small class="text-muted">Custom URL for this product</small>
    </div>
</form>
