<div class="variant-management">
    <div class="simple-form-group">
        <label class="simple-form-label">Product Variants</label>
        <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" name="has_variants" id="hasVariants" 
                   {% if product.has_variants %}checked{% endif %} onchange="toggleVariantsSection()">
            <label class="form-check-label">This product has options like size or color</label>
        </div>
    </div>

    <div id="variantsSection" class="mt-4 {% if not product.has_variants %}d-none{% endif %}">
        <!-- Variant options will be dynamically managed here -->
        <div id="variantOptionsContainer">
            {% if product.variants.exists %}
                <!-- Existing variants will be loaded here -->
            {% else %}
                <p class="text-muted">No variants configured yet.</p>
            {% endif %}
        </div>
        
        <button type="button" class="btn btn-outline-primary btn-sm mt-3" onclick="addVariantOption()">
            <i class="fas fa-plus me-2"></i>Add Variant Option
        </button>
    </div>
</div>

<script>
function toggleVariantsSection() {
    const variantsSection = document.getElementById('variantsSection');
    const hasVariants = document.getElementById('hasVariants').checked;
    
    if (hasVariants) {
        variantsSection.classList.remove('d-none');
    } else {
        variantsSection.classList.add('d-none');
    }
}

function addVariantOption() {
    // Variant management logic will be implemented here
    console.log('Add variant option');
}
</script>
