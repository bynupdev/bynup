<form id="digitalForm">
    {% csrf_token %}
    <input type="hidden" name="product_id" value="{{ product.id }}">
    
    <div class="simple-form-group">
        <label class="simple-form-label">Digital Product File</label>
        {% if product.digital_file %}
        <div class="mb-2">
            <i class="fas fa-file me-2"></i>
            <span>{{ product.digital_file.name }}</span>
            <a href="{{ product.digital_file.url }}" target="_blank" class="btn btn-sm btn-outline-primary ms-2">
                <i class="fas fa-download"></i>
            </a>
        </div>
        {% endif %}
        <input type="file" class="simple-form-control" name="digital_file">
        <small class="text-muted">File that customers will download after purchase</small>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="simple-form-group">
                <label class="simple-form-label">Download Limit</label>
                <input type="number" class="simple-form-control" name="download_limit" value="{{ product.download_limit }}" min="1">
                <small class="text-muted">Number of times file can be downloaded</small>
            </div>
        </div>
        <div class="col-md-6">
            <div class="simple-form-group">
                <label class="simple-form-label">Download Expiry (Days)</label>
                <input type="number" class="simple-form-control" name="download_expiry" value="{{ product.download_expiry }}" min="1">
                <small class="text-muted">Days until download link expires</small>
            </div>
        </div>
    </div>
</form>
