<form id="basicInfoForm">
    {% csrf_token %}
    <input type="hidden" name="product_id" value="{{ product.id }}">
    
    <div class="row">
        <div class="col-md-8">
            <div class="simple-form-group">
                <label class="simple-form-label">Product Title *</label>
                <input type="text" class="simple-form-control" name="title" value="{{ product.title }}" required>
            </div>

            <div class="simple-form-group">
                <label class="simple-form-label">Description</label>
                <textarea class="simple-form-control" name="description" rows="4">{{ product.description }}</textarea>
            </div>

            <div class="simple-form-group">
                <label class="simple-form-label">Short Description</label>
                <textarea class="simple-form-control" name="short_description" rows="2">{{ product.short_description }}</textarea>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="simple-form-group">
                <label class="simple-form-label">Status</label>
                <select class="simple-form-control" name="status">
                    <option value="draft" {% if product.status == 'draft' %}selected{% endif %}>Draft</option>
                    <option value="active" {% if product.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="archived" {% if product.status == 'archived' %}selected{% endif %}>Archived</option>
                </select>
            </div>

            <div class="simple-form-group">
                <label class="simple-form-label">Product Type</label>
                <select class="simple-form-control" name="type" id="productType">
                    <option value="physical" {% if product.type == 'physical' %}selected{% endif %}>Physical Product</option>
                    <option value="digital" {% if product.type == 'digital' %}selected{% endif %}>Digital Product</option>
                    <option value="service" {% if product.type == 'service' %}selected{% endif %}>Service</option>
                </select>
            </div>

            <div class="simple-form-group">
                <label class="simple-form-label">Category</label>
                <select class="simple-form-control" name="category">
                    <option value="">Uncategorized</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}" {% if product.category.id == category.id %}selected{% endif %}>
                        {{ category.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="simple-form-group">
                <label class="simple-form-label">Product Image</label>
                <div class="mb-2">
                    {% if product.main_image %}
                    <img src="{{ product.main_image.url }}" alt="{{ product.title }}" class="img-thumbnail" style="max-height: 150px;">
                    {% endif %}
                </div>
                <input type="file" class="simple-form-control" name="main_image" accept="image/*">
            </div>

            <div class="simple-form-group">
                <label class="simple-form-label">Tags</label>
                <input type="text" class="simple-form-control" name="tags" value="{{ product.tags|join:', ' }}" 
                       placeholder="tag1, tag2, tag3">
            </div>
        </div>
    </div>
</form>
