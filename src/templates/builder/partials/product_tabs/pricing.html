<form id="pricingForm">
    {% csrf_token %}
    <input type="hidden" name="product_id" value="{{ product.id }}">
    
    <div class="row">
        <div class="col-md-6">
            <div class="simple-form-group">
                <label class="simple-form-label">Price ($) *</label>
                <input type="number" class="simple-form-control" name="price" value="{{ product.price }}" step="0.01" min="0" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="simple-form-group">
                <label class="simple-form-label">Compare at Price ($)</label>
                <input type="number" class="simple-form-control" name="compare_at_price" value="{{ product.compare_at_price|default:'' }}" step="0.01" min="0">
                <small class="text-muted">Show a "sale" badge when set</small>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="simple-form-group">
                <label class="simple-form-label">Cost per Item ($)</label>
                <input type="number" class="simple-form-control" name="cost_per_item" value="{{ product.cost_per_item|default:'' }}" step="0.01" min="0">
                <small class="text-muted">For profit calculations</small>
            </div>
        </div>
        <div class="col-md-6">
            <div class="simple-form-group">
                <label class="simple-form-label">Charge Tax</label>
                <div class="form-check form-switch mt-2">
                    <input class="form-check-input" type="checkbox" name="charge_tax" {% if product.charge_tax %}checked{% endif %}>
                    <label class="form-check-label">Charge sales tax on this product</label>
                </div>
            </div>
        </div>
    </div>
</form>
