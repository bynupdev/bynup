{% load social_filters %}
<div class="social-item {% if not social.is_active %}inactive{% endif %}" data-platform="{{ social.platform }}">
    <div class="social-item-header">
        <div class="platform-icon" style="background: {{ social.get_color }};">
            <i class="{{ social.get_icon }}"></i>
        </div>
        <div class="platform-info">
            <div class="platform-name">
                {{ social.get_platform_display }}
                <span class="status-badge {% if not social.is_active %}inactive{% endif %}"></span>
            </div>
            <div class="platform-handle" title="{{ social.raw_handle }}">
                {{ social.raw_handle|truncatechars:30 }}
            </div>
        </div>
        <button class="btn btn-outline" style="padding: 0.3rem 0.8rem;" onclick="toggleForm('{{ social.platform }}')">
            <i class="fas fa-chevron-down"></i>
        </button>
    </div>
    
    <div class="social-form" id="form-{{ social.platform }}">
        <div class="platform-help">
            <i class="fas fa-info-circle"></i>
            <strong>{{ social.get_platform_display }}:</strong> {{ social.get_field_info.help }}
            <div class="example">Example: {{ social.get_field_info.example }}</div>
        </div>
        <form onsubmit="updateSocial('{{ social.platform }}'); return false;">
            <input type="hidden" name="platform" value="{{ social.platform }}">
            <div class="form-group">
                <label class="form-label">
                    {{ social.get_platform_display }} 
                </label>
                <input type="text" class="form-control" name="raw_handle" 
                       value="{{ social.raw_handle }}" 
                       placeholder="{{ social.get_field_info.placeholder }}">
                <small class="input-hint"><i class="fas fa-lightbulb"></i> {{ social.get_field_info.help }}</small>
            </div>
            <div class="form-group">
                <label class="form-label">Display Name (optional)</label>
                <input type="text" class="form-control" name="display_name" value="{{ social.display_name|default:'' }}" 
                       placeholder="{{ social.get_platform_display }}">
                <small class="input-hint"><i class="fas fa-pencil-alt"></i> Custom text to show instead of icon</small>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" name="is_active" id="edit-active-{{ social.platform }}" {% if social.is_active %}checked{% endif %}>
                <label class="form-check-label" for="edit-active-{{ social.platform }}">Active</label>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" name="open_in_new_tab" id="edit-newtab-{{ social.platform }}" {% if social.open_in_new_tab %}checked{% endif %}>
                <label class="form-check-label" for="edit-newtab-{{ social.platform }}">Open in new tab</label>
            </div>
            <div class="social-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Update
                </button>
                <button type="button" class="btn btn-danger" onclick="deleteSocial('{{ social.platform }}')">
                    <i class="fas fa-trash"></i> Remove
                </button>
            </div>
        </form>
    </div>
</div>
