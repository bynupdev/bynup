{% if show_bynup_branding %}
<style>
    .bynup-branding {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    .bynup-branding a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        padding: 8px 16px;
        border-radius: 40px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.04);
        text-decoration: none;
        color: #4a5568;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s ease;
    }
    
    .bynup-branding a:hover {
        background: white;
        box-shadow: 0 4px 16px rgba(67, 97, 238, 0.15);
        border-color: rgba(67, 97, 238, 0.2);
        transform: translateY(-1px);
        color: #4361ee;
    }
    
    .bynup-branding .bynup-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
        border-radius: 6px;
        color: white;
        font-size: 11px;
        font-weight: 700;
    }
    
    .bynup-branding .bynup-text {
        letter-spacing: 0.3px;
    }
    
    .bynup-branding .bynup-text strong {
        font-weight: 700;
        background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    
    /* Mobile adjustments */
    @media (max-width: 768px) {
        .bynup-branding {
            bottom: 12px;
            right: 12px;
        }
        
        .bynup-branding a {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .bynup-branding .bynup-icon {
            width: 20px;
            height: 20px;
            font-size: 10px;
        }
    }
    
    /* Dark mode support - if website has dark background */
    @media (prefers-color-scheme: dark) {
        .bynup-branding a {
            background: rgba(30, 30, 40, 0.95);
            color: #e2e8f0;
            border-color: rgba(255, 255, 255, 0.08);
        }
        
        .bynup-branding a:hover {
            background: rgba(40, 40, 55, 0.98);
            color: #a78bfa;
        }
    }
</style>

<div class="bynup-branding">
    <a href="{{bynup_url}}" target="_blank" rel="noopener noreferrer" title="Create your own website with bynUp">
        <span class="bynup-icon">b</span>
        <span class="bynup-text">Powered by <strong>bynUp</strong></span>
    </a>
</div>
{% endif %}
