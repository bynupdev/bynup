<!DOCTYPE html>
<html lang="en">
<head>

        <style>
            :root {
                --background: #4361ee;
                --text: #3a0ca3;
                --heading: #f72585;
                --primary: #ffffff;
                --secondary: #212529;
                --accent: #0b1e33;
                --border: #dee2e6;
                --success: #06d6a0;
                --warning: #ffd166;
                --error: #ef476f;
                --nav-bg: #333333;
                --nav-text: #ffffff;
                --card-bg: #f8f9fa;
                --button-bg: #4361ee;
                --button-text: #ffffff;
                --button-hover: #3a0ca3;
            }
        </style>
        
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page.brand_name }}{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .page-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .nav { background: #333; padding: 1rem; margin-bottom: 2rem; border-radius: 8px; }
        .nav a { color: var(--nav-text, white); margin-right: 1.5rem; text-decoration: none; font-weight: 500; }
        .nav a:hover { color: #4361ee; }
        .active-page { color: #4361ee !important; font-weight: bold; }
        
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="page-container">
        <nav class="nav">
            <a href="?page=home" class="{% if current_page == 'home' %}active-page{% endif %}">Home</a>
            <a href="?page=products" class="{% if current_page == 'products' %}active-page{% endif %}">Products</a>
            <a href="?page=about" class="{% if current_page == 'about' %}active-page{% endif %}">About</a>
            <a href="?page=contact" class="{% if current_page == 'contact' %}active-page{% endif %}">Contact</a>
            <a href="?page=cart" class="{% if current_page == 'cart' %}active-page{% endif %}">Cart</a>
        </nav>

        {% block content %}{% endblock %}
    </div>

    {% block extra_js %}{% endblock %}
    
    <!-- Tracking Codes -->
    {% for tracking_code in tracking_codes %}
        {{ tracking_code.code|safe }}
    {% endfor %}
</body>
</html>
