<section class="component-shopping-cart editable-section" data-section="shopping-cart-1"
         style="padding: 40px 0; background: white;">
    <div class="container">
        <h2 class="editable-text text-center mb-5" data-text="cart-title"
            style="color: #333; font-weight: 700;">
            Your Shopping Cart
        </h2>
        
        <div class="row">
            <div class="col-lg-8">
                <!-- Cart Items -->
                <div class="cart-items" id="cartItems">
                    <!-- Dynamic cart items will be inserted here -->
                    <div class="empty-cart text-center py-5">
                        <i class="fas fa-shopping-cart fa-3x text-muted mb-3"></i>
                        <h4 class="editable-text" data-text="empty-cart-title">Your cart is empty</h4>
                        <p class="editable-text text-muted" data-text="empty-cart-text">
                            Add some products to get started!
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <!-- Cart Summary -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title editable-text" data-text="summary-title">Order Summary</h5>
                        
                        <div class="summary-details mb-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="editable-text" data-text="subtotal-label">Subtotal:</span>
                                <span id="cartSubtotal">$0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="editable-text" data-text="shipping-label">Shipping:</span>
                                <span id="cartShipping">$0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="editable-text" data-text="tax-label">Tax:</span>
                                <span id="cartTax">$0.00</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-3">
                                <strong class="editable-text" data-text="total-label">Total:</strong>
                                <strong id="cartTotal">$0.00</strong>
                            </div>
                        </div>
                        
                        <button class="btn btn-primary w-100 mb-2" id="proceedToCheckout" disabled>
                            <i class="fas fa-credit-card me-2"></i>
                            <span class="editable-text" data-text="checkout-button">Proceed to Checkout</span>
                        </button>
                        
                        <button class="btn btn-outline-secondary w-100" id="continueShopping">
                            <i class="fas fa-shopping-bag me-2"></i>
                            <span class="editable-text" data-text="continue-shopping-button">Continue Shopping</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</style>

<style>
.component-shopping-cart .cart-item {
    display: flex;
    align-items: center;
    padding: 1rem;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    margin-bottom: 1rem;
    background: #fff;
}
.component-shopping-cart .cart-item-image {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
    margin-right: 1rem;
}
.component-shopping-cart .cart-item-details {
    flex: 1;
}
.component-shopping-cart .quantity-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.component-shopping-cart .quantity-btn {
    width: 30px;
    height: 30px;
    border: 1px solid #dee2e6;
    background: white;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}
.component-shopping-cart .empty-cart {
    display: block;
}
.component-shopping-cart .empty-cart.hidden {
    display: none;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Cart management functionality
    const cart = {
        items: [],
        
        addItem: function(product) {
            // Add item to cart
            this.items.push(product);
            this.updateCartDisplay();
        },
        
        removeItem: function(index) {
            // Remove item from cart
            this.items.splice(index, 1);
            this.updateCartDisplay();
        },
        
        updateQuantity: function(index, quantity) {
            // Update item quantity
            if (quantity <= 0) {
                this.removeItem(index);
            } else {
                this.items[index].quantity = quantity;
                this.updateCartDisplay();
            }
        },
        
        calculateTotals: function() {
            const subtotal = this.items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = subtotal > 0 ? 5.00 : 0; // Example shipping
            const tax = subtotal * 0.08; // Example tax 8%
            const total = subtotal + shipping + tax;
            
            return { subtotal, shipping, tax, total };
        },
        
        updateCartDisplay: function() {
            const cartItems = document.getElementById('cartItems');
            const emptyCart = cartItems.querySelector('.empty-cart');
            const proceedButton = document.getElementById('proceedToCheckout');
            
            if (this.items.length === 0) {
                emptyCart.classList.remove('hidden');
                proceedButton.disabled = true;
                return;
            }
            
            emptyCart.classList.add('hidden');
            proceedButton.disabled = false;
            
            // Update cart items display
            // This would be implemented based on your product structure
        }
    };
    
    // Make cart globally available for product components
    window.shoppingCart = cart;
});
</script>
