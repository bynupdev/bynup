<!-- 
COMPONENT: Contact Form
TYPE: form
EDITABLE: true
-->
<section class="component-contact-form editable-section" data-section="contact-form" 
         style="padding: 80px 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
  <div class="container">
    <div style="max-width: 600px; margin: 0 auto;">
      <h2 class="editable-text" data-text="contact-title"
          style="text-align: center; margin-bottom: 1rem;">
        Get In Touch
      </h2>
      <p class="editable-text" data-text="contact-subtitle"
         style="text-align: center; margin-bottom: 3rem; opacity: 0.9;">
        Have questions? We'd love to hear from you.
      </p>
      
      <form class="editable-section" data-section="contact-form-element"
            style="background: white; padding: 2rem; border-radius: 8px; color: #333;">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Name</label>
          <input type="text" class="editable-text" data-text="name-placeholder"
                 style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;"
                 placeholder="Your Name">
        </div>
        
        <div style="margin-bottom: 1rem;">
          <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Email</label>
          <input type="email" class="editable-text" data-text="email-placeholder"
                 style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;"
                 placeholder="your@email.com">
        </div>
        
        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Message</label>
          <textarea class="editable-text" data-text="message-placeholder"
                    style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; height: 120px;"
                    placeholder="Your message..."></textarea>
        </div>
        
        <button type="submit" class="editable-text" data-text="submit-text"
                style="background: #007bff; color: white; padding: 0.75rem 2rem; border: none; border-radius: 4px; width: 100%; font-size: 1.1rem;">
          Send Message
        </button>
      </form>
    </div>
  </div>
</section>

<style>
  input{
    width: 100%;
  }
</style>
