<section class="component-stripe-checkout editable-section" data-section="stripe-checkout-1"
         style="padding: 60px 0; background: #f8f9fa;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="editable-text text-center mb-4" data-text="checkout-title"
                            style="color: #333; font-weight: 600;">
                            Complete Your Purchase
                        </h3>
                        
                        <!-- Order Summary -->
                        <div class="order-summary mb-4 p-3 border rounded" id="orderSummary">
                            <h5 class="mb-3">Order Summary</h5>
                            <div id="orderItems">
                                <!-- Dynamic order items will be inserted here -->
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <strong>Total:</strong>
                                <strong id="orderTotal">$0.00</strong>
                            </div>
                        </div>
                        
                        <!-- Customer Information -->
                        <div class="customer-info mb-4">
                            <h5 class="mb-3">Customer Information</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="customerName" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="customerName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="customerEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="customerEmail" required>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Payment Button -->
                        <div class="text-center">
                            <button class="btn btn-primary btn-lg w-100" id="checkoutButton" 
                                    style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 15px; font-size: 1.1rem;">
                                <i class="fas fa-lock me-2"></i>
                                <span class="editable-text" data-text="checkout-button-text">
                                    Pay Now - $0.00
                                </span>
                            </button>
                        </div>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                <i class="fas fa-shield-alt me-1"></i>
                                <span class="editable-text" data-text="security-text">
                                    Secure payment powered by Stripe
                                </span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
.component-stripe-checkout .order-summary {
    background: #fff;
}
.component-stripe-checkout .order-item {
    display: flex;
    justify-content: between;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid #eee;
}
.component-stripe-checkout .order-item:last-child {
    border-bottom: none;
}
.component-stripe-checkout #checkoutButton:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // This script will be enhanced by the main editor JavaScript
    const checkoutButton = document.getElementById('checkoutButton');
    const customerName = document.getElementById('customerName');
    const customerEmail = document.getElementById('customerEmail');
    
    function updateCheckoutButton() {
        const total = document.getElementById('orderTotal').textContent;
        checkoutButton.querySelector('span').textContent = `Pay Now - ${total}`;
    }
    
    function validateForm() {
        return customerName.value.trim() !== '' && 
               customerEmail.value.trim() !== '' &&
               document.getElementById('orderTotal').textContent !== '$0.00';
    }
    
    function updateButtonState() {
        checkoutButton.disabled = !validateForm();
    }
    
    customerName.addEventListener('input', updateButtonState);
    customerEmail.addEventListener('input', updateButtonState);
    
    // Initialize
    updateCheckoutButton();
    updateButtonState();
});
</script>
