<!-- builder/components/typography/rich-text.html -->
<div class="rich-text-wrapper" data-component-id="{{ component_id }}">
  <div class="rich-text" data-section="container"
       style="text-align: {{ settings.alignment|default:'left' }};
              color: {{ settings.color|default:'inherit' }};
              max-width: {{ settings.max_width|default:'800px' }};
              margin: 0 auto;
              font-size: 1rem;
              line-height: 1.6;">
    
    <div data-text="content" class="rich-text-content">
      {{ rich_content|default:'
      <h2>Rich Text Editor</h2>
      <p>This component supports <strong>bold</strong>, <em>italic</em>, <u>underlined</u> text, and more.</p>
      <ul>
        <li>Bullet points</li>
        <li>Numbered lists</li>
        <li>And other formatting</li>
      </ul>
      <p>You can also add <a href="#">links</a> and other HTML elements.</p>
      '|safe }}
    </div>
  </div>
  
  <style>
    .rich-text-wrapper {
      width: 100%;
    }
    
    .rich-text {
      font-family: inherit;
    }
    
    .rich-text h1 { font-size: 2.5em; margin-bottom: 0.5em; }
    .rich-text h2 { font-size: 2em; margin-bottom: 0.5em; }
    .rich-text h3 { font-size: 1.75em; margin-bottom: 0.5em; }
    .rich-text p { margin-bottom: 1em; }
    .rich-text ul, .rich-text ol { margin-left: 1.5em; margin-bottom: 1em; }
    .rich-text a { color: #4361ee; text-decoration: underline; }
    
    @media (max-width: 768px) {
      .rich-text {
        font-size: 0.95rem;
      }
    }
  </style>
</div>
