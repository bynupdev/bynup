<div class="component-product-card editable-section" data-section="product-1"
     style="border: 1px solid #e9ecef; border-radius: 8px; padding: 1rem; background: white;">
    <div class="product-image mb-3">
        <imgsrc="https://cdn.pixabay.com/photo/2023/12/23/08/42/island-8465139_1280.png" alt="Product" 
             class="img-fluid rounded editable-image" data-image="product-image-1"
             style="width: 100%; height: 200px; object-fit: cover;">
    </div>
    
    <h4 class="editable-text" data-text="product-title-1" style="color: #333; margin-bottom: 0.5rem;">
        Product Title
    </h4>
    
    <p class="editable-text text-muted" data-text="product-description-1" style="margin-bottom: 1rem;">
        Product description goes here. This is a sample product description.
    </p>
    
    <div class="product-price mb-3">
        <strong class="editable-text" data-text="product-price-1" style="font-size: 1.25rem; color: #28a745;">
            $29.99
        </strong>
    </div>
    
    <div class="product-actions">
        <button class="btn btn-primary w-100 buy-now-btn" 
                data-product-id="1"
                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">
            <i class="fas fa-bolt me-2"></i>
            <span class="editable-text" data-text="buy-now-text">Buy Now</span>
        </button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize buy now buttons
    document.querySelectorAll('.buy-now-btn').forEach(button => {
        button.addEventListener('click', function() {
            const productCard = this.closest('.component-product-card');
            const productData = {
                id: this.dataset.productId,
                title: productCard.querySelector('[data-text="product-title-1"]').textContent,
                description: productCard.querySelector('[data-text="product-description-1"]').textContent,
                price: parseFloat(productCard.querySelector('[data-text="product-price-1"]').textContent.replace('$', '')),
                quantity: 1
            };
            
            // Get customer info (you can enhance this to show a form)
            const customerInfo = {
                email: 'customer@example.com', // In real implementation, get from form
                name: 'Customer Name'
            };
            
            // Trigger instant checkout
            if (window.checkoutManager) {
                window.checkoutManager.handleBuyNow(productData, customerInfo);
            } else {
                console.error('Checkout manager not initialized');
            }
        });
    });
});
</script>
