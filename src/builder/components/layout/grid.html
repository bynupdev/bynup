<!-- builder/components/layout/grid.html -->
<div class="grid-wrapper" data-component-id="{{ component_id }}">
  <div class="grid" data-section="grid"
       style="display: grid;
              grid-template-columns: repeat({{ settings.columns_desktop|default:'3' }}, 1fr);
              gap: {{ settings.gap|default:'2rem' }};
              align-items: {{ settings.alignment|default:'stretch' }};
              justify-content: {{ settings.distribution|default:'start' }};
              padding: {{ settings.padding|default:'1rem' }};
              background: {{ settings.background|default:'transparent' }};">
    
    <!-- Grid columns with individual drop zones -->
    {% for i in 1..settings.columns_desktop|default:3 %}
    <div class="grid-column" data-zone="column-{{ i }}" 
         style="display: flex; flex-direction: column; gap: 1rem;">
      <!-- Components dropped here will be placed in this column -->
    </div>
    {% endfor %}
  </div>
  
  <style>
    .grid-wrapper {
      width: 100%;
    }
    
    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: repeat({{ settings.columns_tablet|default:'2' }}, 1fr) !important;
      }
    }
    
    @media (max-width: 640px) {
      .grid {
        grid-template-columns: repeat({{ settings.columns_mobile|default:'1' }}, 1fr) !important;
        gap: 1rem;
      }
    }
  </style>
</div>
