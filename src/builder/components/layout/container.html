<!-- builder/components/layout/container.html -->
<div class="container-wrapper" data-component-id="{{ component_id }}">
  <div class="container" data-section="container"
       style="max-width: {{ settings.max_width|default:'1200px' }}; 
              width: {{ settings.width|default:'100%' }};
              margin: 0 auto;
              padding: {{ settings.padding|default:'2rem 1rem' }};
              background: {{ settings.background_color|default:'transparent' }};
              border-radius: {{ settings.border_radius|default:'0' }};">
    
    <!-- Slot for child components -->
    <div class="container-content" data-zone="content">
      <!-- Child components will be placed here -->
    </div>
  </div>
  
  <style>
    .container-wrapper {
      position: relative;
      width: 100%;
    }
    
    .container {
      position: relative;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 1.5rem 0.75rem;
      }
    }
  </style>
</div>
